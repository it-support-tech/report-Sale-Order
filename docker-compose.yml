services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reportdn}
      POSTGRES_USER: ${DB_USER:-reportdn}
      POSTGRES_PASSWORD: ${DB_PASS:-reportdn}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reportdn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-reportdn}
      DB_USER: ${DB_USER:-reportdn}
      DB_PASS: ${DB_PASS:-reportdn}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html

volumes:
  db_data:
